{% extends "base_dashboard.html" %}
{% block title %}Konfirmasi Cetak Laporan{% endblock %}

{% block dashboard_content %}
<div class="max-w-xl mx-auto px-4 py-10">
  <h1 class="text-xl font-semibold mb-4 text-slate-900 dark:text-slate-100">
    Laporan berhasil dikirim
  </h1>
  <p class="text-sm text-slate-700 dark:text-slate-300 mb-6">
    Apakah Anda ingin mencetak laporan ini dalam bentuk PDF?
  </p>

  <div class="flex gap-3">
    <a href="{{ url_for('reports.cetak_pdf', laporan_id=laporan.id) }}"
       class="px-4 py-2 rounded-lg text-sm font-semibold
              bg-blue-600 text-white hover:bg-blue-700
              dark:bg-blue-500 dark:hover:bg-blue-400">
      Ya, cetak PDF
    </a>
    <a href="{{ url_for('reports.riwayat_laporan') }}"
       class="px-4 py-2 rounded-lg text-sm font-semibold
              border border-slate-300 text-slate-700
              dark:border-slate-600 dark:text-slate-100">
      Tidak, kembali ke riwayat
    </a>
  </div>
</div>
<script>
  function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const backdrop = document.getElementById('sidebar-backdrop');

    // Toggle Sidebar
    if (sidebar) {
        sidebar.classList.toggle('hidden');
    }

    // Toggle Backdrop (Layar gelap)
    if (backdrop) {
        backdrop.classList.toggle('hidden');
    }
  }
</script>
{% endblock %}
