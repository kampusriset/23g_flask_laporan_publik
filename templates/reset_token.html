{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="auth-bg d-flex align-items-center justify-content-center min-vh-100 px-2 py-4">
    <div class="w-100" style="max-width:420px;">
        <div class="card shadow-lg border-0 rounded-4">
            <!-- HEADER HIJAU -->
            <div class="card-header bg-success text-white text-center py-4 rounded-top-4 mb-2 border-0">
                <i class="bi bi-lock-fill fs-1"></i>
                <h4 class="mb-0 fw-bold mt-2">Reset Password</h4>
                <small class="d-block mt-1 text-light">LaporIN – Sistem Pelaporan Fasilitas Publik</small>
            </div>
            <!-- FORM -->
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="password" name="password" placeholder="Minimal 6 karakter" required minlength="6">
                            <span class="input-group-text" onclick="togglePassword('password','togglePassword1')" style="cursor:pointer;">
                                <i class="bi bi-eye" id="togglePassword1"></i>
                            </span>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label fw-semibold">Konfirmasi Password <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Ulangi password baru" required minlength="6">
                            <span class="input-group-text" onclick="togglePassword('confirm_password','togglePassword2')" style="cursor:pointer;">
                                <i class="bi bi-eye" id="togglePassword2"></i>
                            </span>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success btn-lg w-100 fw-bold mb-2">
                        <i class="bi bi-check-circle"></i> Simpan Password Baru
                    </button>
                </form>
                <div id="resetLinkResult" class="mt-4 fw-semibold text-primary"></div>
            </div>
        </div>
         <div class="card-footer text-center text-muted small border-0 bg-transparent pt-4 pb-2">
                <p>&copy; 2025 LaporIn. All rights reserved. | Dibuat Untuk Kemudahan Masyarakat | <a href="/privacy">Kebijakan Privasi</a> | <a href="/terms">Syarat &amp; Ketentuan</a></p>
            </div>
    </div>
</div>

<script>
function togglePassword(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (input.type === "password") {
        input.type = "text";
        icon.classList.remove("bi-eye");
        icon.classList.add("bi-eye-slash");
    } else {
        input.type = "password";
        icon.classList.remove("bi-eye-slash");
        icon.classList.add("bi-eye");
    }
}
</script>
{% endblock %}
